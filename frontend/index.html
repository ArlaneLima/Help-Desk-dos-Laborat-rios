<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Help Desk dos Laboratórios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@600;700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#eef1ec;--board:#fbfcfa;--ink:#15231d;--mute:#56645c;--line:#c9d1c8;--signal:#f2c21b;--alert:#b42318;--moss:#2f5d46;
--p1:#b42318;--p2:#c2570c;--p3:#1f5f99;--p4:#66737c;
--head:"Archivo Narrow","Arial Narrow",Arial,sans-serif;--body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root{--paper:#121a16;--board:#1a2520;--ink:#e8eee9;--mute:#9aa8a0;--line:#33443b;--moss:#7fc29b;--alert:#ff8a7a;--p1:#ff7a6b;--p2:#ff9f57;--p3:#6fb0f0;--p4:#a3b0b8}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 1rem/1.5 var(--body)}
header{display:flex;flex-wrap:wrap;gap:.5rem 1.5rem;align-items:center;justify-content:space-between;padding:1.25rem clamp(1rem,4vw,2.5rem);border-bottom:4px solid var(--signal)}
h1{font:700 clamp(1.7rem,4vw,2.4rem)/1 var(--head);margin:0;letter-spacing:.01em}
.saude{font-size:.9rem;color:var(--mute);display:flex;align-items:center;gap:.5rem}
.saude::before{content:"";width:.7rem;height:.7rem;border-radius:50%;background:var(--mute)}
.saude.ok::before{background:var(--moss)}.saude.erro{color:var(--alert)}.saude.erro::before{background:var(--alert)}
main{display:grid;grid-template-columns:minmax(260px,330px) 1fr;gap:clamp(1rem,3vw,2.5rem);padding:1.5rem clamp(1rem,4vw,2.5rem);align-items:start}
@media (max-width:820px){main{grid-template-columns:1fr}}
.novo{background:var(--board);border:1px solid var(--line);padding:1rem 1.1rem;position:sticky;top:1rem}
@media (max-width:820px){.novo{position:static}}
summary{font:700 1.35rem/1.2 var(--head);cursor:pointer}
form{display:grid;gap:.8rem;margin-top:1rem}
label{display:grid;gap:.25rem;font-weight:500;font-size:.92rem}
input,select,textarea{font:inherit;color:inherit;background:var(--paper);border:1px solid var(--line);padding:.55rem .65rem;width:100%;border-radius:2px}
textarea{resize:vertical;min-height:4.5rem}
:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
button{font:600 .92rem var(--body);cursor:pointer;border:1px solid var(--ink);background:transparent;color:var(--ink);padding:.5rem .9rem;border-radius:2px}
button:hover{background:var(--ink);color:var(--paper)}
button.primario{background:var(--signal);border-color:var(--signal);color:#15231d}
button.primario:hover{background:#ffd53d;color:#15231d}
.abas{display:flex;gap:.25rem;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:.5rem}
.abas button{border:0;border-bottom:3px solid transparent;border-radius:0;padding:.6rem .8rem;white-space:nowrap;background:none}
.abas button[aria-selected=true]{border-bottom-color:var(--signal);font-weight:700;color:var(--ink)}
.abas button:hover{background:none;border-bottom-color:var(--line)}
.abas b{font-weight:600;color:var(--mute);margin-left:.3rem}
ul{list-style:none;margin:0;padding:0;background:var(--board);border:1px solid var(--line)}
li{display:grid;grid-template-columns:4.2rem 1fr;gap:.25rem 1rem;padding:1rem 1.1rem 1rem 0;border-bottom:1px solid var(--line);border-left:6px solid var(--cor)}
li:last-child{border-bottom:0}
.prio{font:700 1.9rem/1 var(--head);color:var(--cor);text-align:center;padding-top:.15rem}
.corpo h2{font:700 1.2rem/1.25 var(--head);margin:0}
.corpo .lab{color:var(--mute);font-size:.88rem;margin:.1rem 0 .4rem}
.corpo p{margin:.2rem 0;max-width:70ch;overflow-wrap:anywhere}
.sol{border-left:3px solid var(--moss);padding-left:.6rem;color:var(--ink)}
.estado{display:flex;flex-wrap:wrap;gap:.4rem .9rem;align-items:center;margin:.5rem 0;font-size:.88rem}
.tag{font-weight:600;padding:.1rem .5rem;border:1px solid currentColor;border-radius:2px}
.tag.venceu{background:var(--alert);border-color:var(--alert);color:#fff}
.regua{height:.55rem;background:var(--paper);border:1px solid var(--line);margin:.45rem 0 .2rem;max-width:26rem}
.regua i{display:block;height:100%;background:var(--moss)}
.regua.atencao i{background:var(--p2)}
.regua.venceu i{background:repeating-linear-gradient(-45deg,var(--signal) 0 .45rem,#15231d .45rem .9rem)}
.prazo{font-size:.86rem;color:var(--mute)}.prazo.venceu{color:var(--alert);font-weight:600}
.acoes{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.6rem}
.acoes form{display:grid;width:100%;max-width:30rem;margin:0}
.acoes form[hidden]{display:none}
#vazio{padding:2rem 1rem;color:var(--mute)}
#aviso{position:fixed;left:50%;bottom:1rem;transform:translateX(-50%);max-width:min(32rem,92vw);background:var(--ink);color:var(--paper);padding:.7rem 1rem;border-radius:2px;display:none;border-left:6px solid var(--signal)}
#aviso.erro{border-left-color:var(--alert)}#aviso.show{display:block}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(9.5rem,1fr));gap:.75rem;margin-bottom:1rem}
.kpi{background:var(--board);border:1px solid var(--line);border-top:4px solid var(--line);padding:.7rem .9rem}
.kpi b{display:block;font:700 2rem/1 var(--head)}
.kpi span{font-size:.82rem;color:var(--mute)}
.kpi.fila{border-top-color:var(--p3)}.kpi.atend{border-top-color:var(--signal)}
.kpi.ok{border-top-color:var(--moss)}.kpi.venc{border-top-color:var(--alert)}.kpi.venc.tem b{color:var(--alert)}
.busca{display:flex;gap:.5rem;margin:0 0 .75rem}
.busca input{max-width:26rem}
.legenda{display:flex;flex-wrap:wrap;gap:.35rem 1rem;font-size:.8rem;color:var(--mute);margin:0 0 .75rem}
.legenda i{display:inline-block;width:.7rem;height:.7rem;margin-right:.3rem;background:var(--cor);vertical-align:-.05rem}
.prio small{display:block;font:600 .62rem/1.2 var(--body);letter-spacing:.05em;text-transform:uppercase;margin-top:.3rem}
footer a{color:var(--moss)}
footer{padding:1rem clamp(1rem,4vw,2.5rem) 2rem;color:var(--mute);font-size:.88rem}
footer label{display:flex;gap:.5rem;align-items:center;font-weight:400}footer input{width:auto}
@media (prefers-reduced-motion:no-preference){#aviso.show{animation:sobe .2s ease-out}@keyframes sobe{from{opacity:0;transform:translate(-50%,.5rem)}}}
</style>
</head>
<body>
<header>
  <h1>Help Desk dos Laboratórios</h1>
  <span id="saude" class="saude">Verificando o banco…</span>
</header>
<main>
  <details class="novo" open>
    <summary>Abrir chamado</summary>
    <form id="form">
      <label>Título<input name="titulo" required minlength="3" maxlength="100" placeholder="Ex.: Projetor sem imagem"></label>
      <label>Laboratório<input name="laboratorio" required maxlength="50" placeholder="Ex.: Lab 3"></label>
      <label>Prioridade
        <select name="prioridade">
          <option value="P1">P1 – atender em 4 h</option>
          <option value="P2">P2 – atender em 8 h</option>
          <option value="P3" selected>P3 – atender em 24 h</option>
          <option value="P4">P4 – atender em 72 h</option>
        </select>
      </label>
      <label>O que está acontecendo<textarea name="descricao" required minlength="5" maxlength="1000"></textarea></label>
      <button class="primario" type="submit">Abrir chamado</button>
    </form>
  </details>
  <section aria-label="Fila de atendimento">
    <div class="kpis" id="kpis" aria-label="Resumo dos chamados"></div>
    <div class="busca"><input id="busca" type="search" placeholder="Buscar por título, laboratório ou descrição" aria-label="Buscar chamados"></div>
    <p class="legenda" aria-label="Legenda de prioridades">
      <span style="--cor:var(--p1)"><i></i>P1 Crítica · 4 h</span><span style="--cor:var(--p2)"><i></i>P2 Alta · 8 h</span>
      <span style="--cor:var(--p3)"><i></i>P3 Média · 24 h</span><span style="--cor:var(--p4)"><i></i>P4 Baixa · 72 h</span>
    </p>
    <nav class="abas" id="abas" role="tablist" aria-label="Filtrar por status"></nav>
    <ul id="lista"></ul>
    <p id="vazio" hidden></p>
  </section>
</main>
<footer>
  <label><input type="checkbox" id="demo"> Modo demonstração: mostrar todas as mudanças de status, inclusive as inválidas, para ver a API recusar</label>
  <p>Cloud Challenge, Desafio 04 · Grupo 03 · <a href="/health">estado da API e do banco</a></p>
</footer>
<div id="aviso" role="status" aria-live="polite"></div>
<script>
const NOMES = { aberto: 'Aberto', em_atendimento: 'Em atendimento', resolvido: 'Resolvido', fechado: 'Fechado' };
const COR = { P1: 'var(--p1)', P2: 'var(--p2)', P3: 'var(--p3)', P4: 'var(--p4)' };
// Só orienta a interface; a API é quem decide (409 se a transição for inválida).
const PROXIMOS = { aberto: ['em_atendimento'], em_atendimento: ['aberto', 'resolvido'], resolvido: ['fechado'], fechado: [] };
const ROTULO = { 'aberto>em_atendimento': 'Iniciar atendimento', 'em_atendimento>aberto': 'Devolver à fila', 'em_atendimento>resolvido': 'Resolver', 'resolvido>fechado': 'Fechar chamado' };
const ABAS = [['fila', 'Na fila', 'aberto,em_atendimento'], ['aberto', 'Abertos', 'aberto'], ['em_atendimento', 'Em atendimento', 'em_atendimento'],
              ['resolvido', 'Resolvidos', 'resolvido'], ['fechado', 'Fechados', 'fechado'], ['todos', 'Todos', '']];
const NOMEPRIO = { P1: 'Crítica', P2: 'Alta', P3: 'Média', P4: 'Baixa' };
let aba = 'fila', resumo = null, cache = [];

const $ = (s) => document.querySelector(s);
function el(tag, attrs = {}, ...filhos) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) { if (k === 'class') e.className = v; else if (k.startsWith('on')) e[k] = v; else e.setAttribute(k, v); }
  e.append(...filhos.filter((f) => f != null)); return e;
}
function avisar(msg, erro) {
  const a = $('#aviso'); a.textContent = msg; a.className = 'show' + (erro ? ' erro' : '');
  clearTimeout(avisar.t); avisar.t = setTimeout(() => (a.className = ''), 6000);
}
async function api(metodo, url, corpo) {
  const r = await fetch(url, { method: metodo, headers: { 'Content-Type': 'application/json' }, body: corpo ? JSON.stringify(corpo) : undefined });
  const dados = await r.json().catch(() => ({}));
  if (!r.ok) { const det = dados.detalhes ? ' ' + dados.detalhes.join('; ') + '.' : ''; throw new Error(`${r.status}: ${dados.erro || 'erro inesperado'}.${det}`); }
  return dados;
}
const hm = (d) => new Date(d).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
function duracao(ms) {
  const m = Math.max(1, Math.round(ms / 60000)), d = Math.floor(m / 1440), h = Math.floor((m % 1440) / 60);
  return d ? `${d} d ${h} h` : h ? `${h} h ${m % 60} min` : `${m} min`;
}

function regua(c) {
  const ini = +new Date(c.aberto_em), fim = +new Date(c.prazo_sla), ativo = c.status !== 'resolvido' && c.status !== 'fechado';
  if (!ativo) {
    const dentro = c.resolvido_em && +new Date(c.resolvido_em) <= fim;
    return el('div', {}, el('div', { class: 'regua' }, el('i', { style: 'width:100%' })),
      el('span', { class: 'prazo' }, c.resolvido_em ? `Resolvido em ${hm(c.resolvido_em)}, ${dentro ? 'dentro' : 'fora'} do prazo` : 'Encerrado'));
  }
  const agora = Date.now(), pct = Math.min(100, Math.max(2, ((agora - ini) / (fim - ini)) * 100));
  const venceu = c.sla_vencido, classe = venceu ? 'venceu' : pct >= 75 ? 'atencao' : '';
  return el('div', {}, el('div', { class: 'regua ' + classe }, el('i', { style: `width:${venceu ? 100 : pct}%` })),
    el('span', { class: 'prazo ' + (venceu ? 'venceu' : '') }, venceu ? `Prazo era ${hm(fim)}: venceu há ${duracao(agora - fim)}` : `Prazo ${hm(fim)}: faltam ${duracao(fim - agora)}`));
}

function acoes(c) {
  const destinos = $('#demo').checked ? Object.keys(NOMES).filter((s) => s !== c.status) : PROXIMOS[c.status];
  const box = el('div', { class: 'acoes' });
  for (const d of destinos) {
    const rotulo = ROTULO[`${c.status}>${d}`] || `Mover para ${NOMES[d].toLowerCase()}`;
    if (d === 'resolvido') {
      const ta = el('textarea', { name: 'solucao', placeholder: 'Solução aplicada', maxlength: '1000' });
      if (!$('#demo').checked) ta.required = true;
      const f = el('form', { hidden: '' }, el('label', {}, 'Solução aplicada', ta), el('button', { class: 'primario', type: 'submit' }, 'Confirmar resolução'));
      f.onsubmit = (ev) => { ev.preventDefault(); mudar(c.id, d, ta.value); };
      box.append(el('button', { type: 'button', onclick: () => { f.hidden = !f.hidden; if (!f.hidden) ta.focus(); } }, rotulo), f);
    } else box.append(el('button', { type: 'button', onclick: () => mudar(c.id, d) }, rotulo));
  }
  return box;
}

function linha(c) {
  const li = el('li', { style: `--cor:${COR[c.prioridade]}` }, el('div', { class: 'prio', 'aria-label': 'Prioridade ' + c.prioridade }, c.prioridade, el('small', {}, NOMEPRIO[c.prioridade])));
  const corpo = el('div', { class: 'corpo' }, el('h2', {}, c.titulo), el('div', { class: 'lab' }, `${c.laboratorio}, aberto em ${hm(c.aberto_em)}`), el('p', {}, c.descricao));
  if (c.solucao) corpo.append(el('p', { class: 'sol' }, 'Solução: ' + c.solucao));
  corpo.append(el('div', { class: 'estado' }, el('span', { class: 'tag' }, NOMES[c.status]), c.sla_vencido ? el('span', { class: 'tag venceu' }, 'SLA vencido') : null), regua(c), acoes(c));
  li.append(corpo); return li;
}

function desenharAbas() {
  const n = (k) => !resumo ? '' : k === 'fila' ? resumo.aberto + resumo.em_atendimento : k === 'todos' ? resumo.total : resumo[k];
  $('#abas').replaceChildren(...ABAS.map(([k, nome]) => {
    const b = el('button', { role: 'tab', 'aria-selected': String(k === aba), type: 'button' }, nome, el('b', {}, String(n(k))));
    b.onclick = () => { aba = k; carregar(); }; return b;
  }));
}
function desenharKpis() {
  if (!resumo) return;
  const card = (classe, valor, texto) => el('div', { class: 'kpi ' + classe }, el('b', {}, String(valor)), el('span', {}, texto));
  $('#kpis').replaceChildren(
    card('fila', resumo.aberto, 'Abertos, aguardando'),
    card('atend', resumo.em_atendimento, 'Em atendimento'),
    card('venc' + (resumo.sla_vencido ? ' tem' : ''), resumo.sla_vencido, 'SLA vencido'),
    card('ok', resumo.resolvido + resumo.fechado, 'Resolvidos ou fechados'));
}
function desenharLista() {
  const q = $('#busca').value.trim().toLowerCase();
  const itens = q ? cache.filter((c) => `${c.titulo} ${c.laboratorio} ${c.descricao}`.toLowerCase().includes(q)) : cache;
  $('#lista').replaceChildren(...itens.map(linha));
  $('#vazio').textContent = q ? 'Nenhum chamado encontrado para essa busca.' : 'Nenhum chamado nesta visão. Abra um chamado no formulário.';
  $('#vazio').hidden = itens.length > 0; $('#lista').hidden = itens.length === 0;
}
async function carregar() {
  try {
    const filtro = ABAS.find((a) => a[0] === aba)[2];
    const [lista, r] = await Promise.all([api('GET', '/chamados' + (filtro ? '?status=' + filtro : '')), api('GET', '/chamados/resumo')]);
    resumo = r; cache = lista; desenharAbas(); desenharKpis(); desenharLista();
  } catch (e) { avisar(e.message, true); }
}
async function mudar(id, status, solucao) {
  try { await api('PATCH', `/chamados/${id}/status`, { status, solucao }); avisar(`Chamado ${id}: agora está ${NOMES[status].toLowerCase()}.`); }
  catch (e) { avisar(e.message, true); }
  carregar();
}
$('#form').onsubmit = async (ev) => {
  ev.preventDefault();
  try {
    const c = await api('POST', '/chamados', Object.fromEntries(new FormData(ev.target)));
    ev.target.reset(); ev.target.prioridade.value = 'P3';
    avisar(`Chamado ${c.id} aberto. Prazo: ${hm(c.prazo_sla)}.`);
  } catch (e) { avisar(e.message, true); }
  carregar();
};
$('#demo').onchange = carregar;
$('#busca').oninput = desenharLista;
async function saude() {
  const s = $('#saude');
  try { await api('GET', '/health'); s.textContent = 'Banco conectado'; s.className = 'saude ok'; }
  catch { s.textContent = 'Banco indisponível'; s.className = 'saude erro'; }
}
saude(); carregar(); setInterval(() => { if (document.activeElement.tagName !== 'TEXTAREA') { saude(); carregar(); } }, 60000);
</script>
</body>
</html>
